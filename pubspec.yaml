name: image_native_watermark
description: "High-performance native Android & iOS camera frame processing and watermarking (NV21/BGRA to JPEG, rotation, flipping, resizing, and text overlay)."
version: 0.0.1
homepage: https://github.com/andikatp/image_native_watermark
repository: https://github.com/andikatp/image_native_watermark
issue_tracker: https://github.com/andikatp/image_native_watermark/issues

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.andikatp.image_native_watermark
        pluginClass: ImageNativeWatermarkPlugin
      ios:
        pluginClass: ImageNativeWatermarkPlugin
